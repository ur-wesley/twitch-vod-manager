services:
  twitch-vod-worker:
    build:
      context: ../../
      dockerfile: crates/worker/Dockerfile
    container_name: twitch-vod-worker
    restart: unless-stopped
    ports:
      - "${WORKER_PORT:-8080}:8080"
    environment:
      - WORKER_PORT=8080
      - WORKER_API_KEY=${WORKER_API_KEY:-secret_api_key_change_me}
      - DATA_DIR=/data
      - RUST_LOG=info,vod_worker=debug
    volumes:
      - twitch-vod-worker-data:/data

volumes:
  twitch-vod-worker-data:
