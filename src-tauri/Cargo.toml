[package]
name = "twitch-vod-manager"
version = "0.1.0"
description = "Desktop Twitch VOD Downloader, Compressor and Cloud/YouTube Manager"
authors = ["Wesley"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "twitch_vod_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-store = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
regex = "1"
url = "2"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
hmac = "0.12"
dunce = "1"
dirs = "6.0"
open = "5.3"
toml = "0.8"
futures-util = "0.3"
vod-core = { path = "../crates/core" }
